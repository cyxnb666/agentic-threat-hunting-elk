# PUSH channel: endpoint agents POST newline-delimited records to http://127.0.0.1:8080 with basic auth
# (user "endpoint") and the header "X-Hunt-Source: <source_id>".
# application/x-ndjson -> "line" codec: every line becomes one event with the raw record in [message].
# Header location verified on 9.5.5: [@metadata][input][http][request][headers][x_hunt_source]
# (names are lower-cased, "-" becomes "_").
input {
  http {
    host => "0.0.0.0"
    port => 8080
    user => "endpoint"
    password => "${PUSH_PASSWORD}"
    additional_codecs => { "application/x-ndjson" => "line" }
    response_code => 202
  }
}

filter {
  mutate { copy => { "[@metadata][input][http][request][headers][x_hunt_source]" => "[@metadata][source_id]" } }
  mutate { add_field => { "[hunt][channel]" => "push" "[hunt][origin]" => "http:%{[host][ip]}" } }
  mutate { remove_field => ["host", "http", "url", "user_agent"] }
}
