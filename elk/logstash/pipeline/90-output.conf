# Shared output. pipeline => "" means "no ingest pipeline" (output reference: if the value resolves to an
# empty string the parameter is not set), so unparsed events are stored exactly as they arrived.
output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "logstash_internal"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    data_stream => "true"
    pipeline => "%{[@metadata][pipeline]}"
  }
}
