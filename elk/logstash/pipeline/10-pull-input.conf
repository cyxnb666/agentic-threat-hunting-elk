# PULL channel: any file deposited under ./dropzone/<source_id>/ is picked up automatically.
# mode => read treats every file as complete (EOF is meaningful) and reads .gz files natively;
# file_completed_action => log_and_delete records the file as done, then deletes it (option names from the
# Logstash file input reference). The delete is what stops re-reads: the file input identifies a file by inode +
# major + minor device number, and the minor device number of the Docker Desktop bind mount changes when Docker
# Desktop restarts, so a file kept in the dropzone looked new and was read again (2026-10-20: pull data doubled).
# The dropzone mount is therefore writable (docker-compose.yml). sincedb lives in the lsdata volume.
# Files must appear atomically: writers copy into dropzone/.staging/ (dot-dirs do not match "*") and rename.
input {
  file {
    path => ["/usr/share/logstash/dropzone/*/**/*"]
    mode => "read"
    file_completed_action => "log_and_delete"
    file_completed_log_path => "/usr/share/logstash/data/dropzone_completed.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_dropzone"
  }
}

filter {
  # /usr/share/logstash/dropzone/<source_id>/<relative path>
  dissect {
    mapping => { "[log][file][path]" => "/usr/share/logstash/dropzone/%{[@metadata][source_id]}/%{[@metadata][relpath]}" }
  }
  mutate { add_field => { "[hunt][channel]" => "pull" "[hunt][origin]" => "file:%{[log][file][path]}" } }
  mutate { remove_field => ["host", "log"] }
}
