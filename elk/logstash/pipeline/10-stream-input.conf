# STREAM channel: a continuous syslog feed (RFC 3164, TCP or UDP) on port 5514, consumed as it arrives.
# The syslog program name carries the source_id (the syslog input stores it in [process][name], verified on
# 9.5.5); the syslog message body is the raw record. 5514 because the container runs as uid 1000.
input {
  syslog {
    port => 5514
  }
}

filter {
  mutate { copy => { "[process][name]" => "[@metadata][source_id]" } }
  mutate { add_field => { "[hunt][channel]" => "stream" "[hunt][origin]" => "syslog:%{[host][hostname]}@%{[host][ip]}" } }
  mutate { strip => ["message"] }
  mutate { remove_field => ["host", "log", "process", "service"] }
}
