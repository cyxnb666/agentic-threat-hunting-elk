# Shared by the pull, push and stream pipelines (runs after the channel filter: Logstash concatenates the
# files of a pipeline in lexicographic order, hence the numeric prefixes).
# The onboarding agent writes registry/sources.json: { "<source_id>": {"pipeline": "...", "dataset": "..."} }.
# Registered sources go to logs-<dataset>-default through their parsing template (an ingest pipeline);
# unknown sources go, unparsed, to logs-hunt.unparsed-default, where the onboarding agent finds them.
filter {
  if ![@metadata][source_id] or [@metadata][source_id] == "" {
    mutate { replace => { "[@metadata][source_id]" => "unknown" } }
  }
  # files written on Windows end lines with CRLF; the line codec leaves the CR in [message]
  mutate { gsub => ["message", "\r$", ""] }
  mutate {
    add_field => { "[hunt][source_id]" => "%{[@metadata][source_id]}" }
    # one definition of the raw record for every channel (the syslog input would put the syslog line here)
    replace => { "[event][original]" => "%{message}" }
    remove_field => ["@version"]
  }

  translate {
    source => "[hunt][source_id]"
    target => "[@metadata][route]"
    dictionary_path => "/usr/share/logstash/registry/sources.json"
    refresh_interval => 5
    refresh_behaviour => "replace"
  }

  if [@metadata][route][pipeline] {
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "%{[@metadata][route][dataset]}"
        "[data_stream][namespace]" => "default"
        "[@metadata][pipeline]" => "%{[@metadata][route][pipeline]}"
      }
    }
  } else {
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "hunt.unparsed"
        "[data_stream][namespace]" => "default"
        "[@metadata][pipeline]" => ""
      }
    }
  }
}
